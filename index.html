<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="전기기능사 CBT" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>전기기능사 모의시험</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#dbe3ee;
  --accent:#2563eb; --accent-soft:#eff6ff; --ok:#16a34a; --ok-soft:#f0fdf4;
  --bad:#dc2626; --bad-soft:#fef2f2; --warn:#ea580c; --warn-soft:#fff7ed; --chip:#e2e8f0;
  --shadow:0 12px 32px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;z-index:20;background:rgba(15,23,42,.95);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,.16)
}
header h1{margin:0;font-size:20px;line-height:1.25}
header p{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,.8);line-height:1.4}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2,h3{margin:0 0 12px}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font-size:16px;background:#fff;color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
button{
  border:none;border-radius:16px;padding:14px 16px;min-height:52px;cursor:pointer;
  background:var(--accent);color:#fff;font-size:16px;font-weight:800
}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
button.ghost{background:#edf2f7;color:var(--text)}
button.warn{background:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:800;color:#334155}
.topstats{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:999px;background:#0f172a;color:#fff;font-size:12px;font-weight:800}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;width:0;background:var(--accent)}
.qtext{font-size:21px;line-height:1.45;font-weight:900;letter-spacing:-.01em}
@media(max-width:520px){.qtext{font-size:19px}}
.choice{
  display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--text);
  border-radius:18px;padding:16px;margin:10px 0;font-size:17px;line-height:1.45
}
.choice small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.choice.selected{border-color:var(--accent);background:var(--accent-soft)}
.answer-sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:560px){.answer-sheet{grid-template-columns:repeat(10,1fr)}}
.num{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;text-align:center;font-weight:900}
.num.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.num.flag{background:var(--warn-soft);border-color:#fb923c;color:#c2410c}
.num.current{outline:3px solid rgba(37,99,235,.25)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.kpi{grid-template-columns:repeat(4,1fr)}}
.metric{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.metric .v{font-size:24px;font-weight:900}
.review{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hidden{display:none!important}
.sticky-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(238,242,247,.94);backdrop-filter:blur(14px);border-top:1px solid rgba(148,163,184,.25)
}
.sticky-nav .wrap{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.sticky-nav button{padding:12px 10px;font-size:14px;min-height:50px}
.install{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:14px}
</style>
</head>
<body>
<header>
  <h1>전기기능사 모의시험</h1>
  <p>GitHub Pages용. 아이폰 Safari 접속 후 홈 화면에 추가하면 앱처럼 쓰기 좋다.</p>
</header>

<main>
  <section class="card">
    <h2>시험 설정</h2>
    <div class="grid">
      <div>
        <label>모드</label>
        <select id="mode">
          <option value="full">랜덤 모의시험</option>
          <option value="전기이론">과목별 연습 · 전기이론</option>
          <option value="전기기기">과목별 연습 · 전기기기</option>
          <option value="전기설비">과목별 연습 · 전기설비</option>
          <option value="wrong">오답노트 복습</option>
        </select>
      </div>
      <div>
        <label>문항 수</label>
        <input id="questionCount" type="number" min="10" max="60" value="60" />
      </div>
      <div>
        <label>제한 시간(분)</label>
        <input id="timeLimit" type="number" min="5" max="120" value="60" />
      </div>
      <div>
        <label>시험 이름</label>
        <input id="examTitle" type="text" value="전기기능사 모의시험" />
      </div>
    </div>
    <div class="chips" style="margin-top:12px">
      <span class="chip">전기이론 40</span>
      <span class="chip">전기기기 40</span>
      <span class="chip">전기설비 40</span>
      <span class="chip">총 120문항</span>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="startBtn">시험 시작</button>
      <button class="secondary" id="sampleBtn">20문항 빠른 테스트</button>
      <button class="ghost" id="resetWrongBtn">오답노트 초기화</button>
      <button class="ghost" id="resetStatsBtn">통계 초기화</button>
    </div>
  </section>

  <section class="card">
    <h2>누적 통계</h2>
    <div class="kpi">
      <div class="metric"><div class="small">총 응시</div><div class="v" id="stTotal">0</div></div>
      <div class="metric"><div class="small">평균 점수</div><div class="v" id="stAvg">0</div></div>
      <div class="metric"><div class="small">최고 점수</div><div class="v" id="stBest">0</div></div>
      <div class="metric"><div class="small">합격 횟수</div><div class="v" id="stPass">0</div></div>
    </div>
  </section>

  <section class="card">
    <h2>아이폰 설치 팁</h2>
    <div class="install small">
      Safari에서 이 페이지를 연 뒤 공유 버튼 → 홈 화면에 추가.
      로컬 파일앱 미리보기 말고 웹주소로 접속해야 터치와 저장이 안정적이다.
    </div>
  </section>

  <section id="exam" class="hidden">
    <div class="card">
      <div class="topstats">
        <div>
          <div class="pill" id="statusPill">1 / 60</div>
          <div class="small" id="subjectText" style="margin-top:8px">전기이론</div>
        </div>
        <div style="text-align:right">
          <div class="pill" id="timerText">60:00</div>
          <div class="small" style="margin-top:8px">남은 시간</div>
        </div>
      </div>
      <div class="progress"><div id="bar"></div></div>
    </div>

    <div class="card">
      <div class="qtext" id="qText"></div>
      <div id="choices" style="margin-top:14px"></div>
      <div class="small" id="tagText"></div>
    </div>

    <div class="card">
      <h3>답안표</h3>
      <div class="answer-sheet" id="answerSheet"></div>
    </div>
  </section>

  <section id="result" class="hidden"></section>
</main>

<div class="sticky-nav hidden" id="navBar">
  <div class="wrap">
    <button class="secondary" id="prevBtn">이전</button>
    <button class="ghost" id="flagBtn">모름 표시</button>
    <button class="secondary" id="nextBtn">다음</button>
    <button class="warn" id="submitBtn">제출</button>
  </div>
</div>

<script>

const WRONG_KEY = "electrician_mock_wrong_notes_gh_v1";
const STATS_KEY = "electrician_mock_stats_gh_v1";
let exam = [], answers = {}, flags = new Set(), idx = 0, timer = null, remain = 0, examMeta = {};

function qs(id){ return document.getElementById(id); }
function shuffle(a){ const arr=[...a]; for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function fmt(sec){ const m=String(Math.floor(sec/60)).padStart(2,"0"); const s=String(sec%60).padStart(2,"0"); return `${m}:${s}`; }
function getStats(){ return JSON.parse(localStorage.getItem(STATS_KEY) || '{"total":0,"sum":0,"best":0,"pass":0}'); }
function renderStats(){ const st=getStats(); qs("stTotal").textContent=st.total; qs("stAvg").textContent=st.total?Math.round(st.sum/st.total):0; qs("stBest").textContent=st.best; qs("stPass").textContent=st.pass; }
function saveStats(score){ const st=getStats(); st.total+=1; st.sum+=score; st.best=Math.max(st.best, score); if(score>=60) st.pass+=1; localStorage.setItem(STATS_KEY, JSON.stringify(st)); renderStats(); }
function buildSource(mode){ if(mode==="full") return bank; if(mode==="wrong"){ const ids=JSON.parse(localStorage.getItem(WRONG_KEY)||"[]"); return bank.filter(q=>ids.includes(q.id)); } return bank.filter(q=>q.subject===mode); }

function startExam(quick=false){
  const mode=qs("mode").value;
  let count=parseInt(qs("questionCount").value||"60",10);
  let minutes=parseInt(qs("timeLimit").value||"60",10);
  if(quick){ count=20; minutes=20; }
  count=Math.max(10, Math.min(60, count));
  minutes=Math.max(5, Math.min(120, minutes));
  const source=buildSource(mode);
  if(!source.length){ alert("이 모드에서 사용할 문항이 없다. 오답노트 모드라면 먼저 시험을 한 번 풀어야 한다."); return; }

  exam=shuffle(source).slice(0, Math.min(count, source.length));
  answers={}; flags=new Set(); idx=0; remain=minutes*60;
  examMeta={ title: qs("examTitle").value.trim() || "전기기능사 모의시험", mode, minutes };
  qs("exam").classList.remove("hidden");
  qs("navBar").classList.remove("hidden");
  qs("result").classList.add("hidden");
  window.scrollTo({top:0, behavior:"smooth"});

  if(timer) clearInterval(timer);
  timer=setInterval(()=>{ remain--; qs("timerText").textContent=fmt(remain); if(remain<=0){ clearInterval(timer); finishExam(true);} }, 1000);
  qs("timerText").textContent=fmt(remain);
  renderQuestion();
}

function renderQuestion(){
  const q=exam[idx];
  qs("statusPill").textContent=`${idx+1} / ${exam.length}`;
  qs("subjectText").textContent=`${q.subject}${flags.has(q.id) ? " · 모름 표시됨" : ""}`;
  qs("bar").style.width=`${((idx+1)/exam.length)*100}%`;
  qs("qText").textContent=q.question;
  qs("tagText").textContent=`태그: ${q.tags}`;
  qs("prevBtn").disabled=idx===0;
  qs("nextBtn").disabled=idx===exam.length-1;
  qs("flagBtn").textContent=flags.has(q.id) ? "모름 해제" : "모름 표시";

  const wrap=qs("choices"); wrap.innerHTML="";
  q.choices.forEach((c,i)=>{ const b=document.createElement("button"); b.className="choice"+(answers[q.id]===i?" selected":""); b.innerHTML=`<small>${i+1}번</small>${c}`; b.onclick=()=>{ answers[q.id]=i; renderQuestion(); }; wrap.appendChild(b); });

  const sheet=qs("answerSheet"); sheet.innerHTML="";
  exam.forEach((item,i)=>{ const d=document.createElement("div"); let cls="num"; if(i===idx) cls+=" current"; if(flags.has(item.id)) cls+=" flag"; else if(answers[item.id]!==undefined) cls+=" done"; d.className=cls; d.textContent=i+1; d.onclick=()=>{ idx=i; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }; sheet.appendChild(d); });
}

function finishExam(auto=false){
  if(timer) clearInterval(timer);
  const wrongSaved=new Set(JSON.parse(localStorage.getItem(WRONG_KEY)||"[]"));
  let correct=0;
  const bySubject={"전기이론":{c:0,t:0},"전기기기":{c:0,t:0},"전기설비":{c:0,t:0}};
  const review=exam.map(q=>{ const user=answers[q.id]; const ok=user===q.answer; bySubject[q.subject].t+=1; if(ok){ correct++; bySubject[q.subject].c+=1; } else wrongSaved.add(q.id); return {q,user,ok}; });
  localStorage.setItem(WRONG_KEY, JSON.stringify([...wrongSaved]));
  const score=Math.round(correct/exam.length*100);
  saveStats(score);

  qs("exam").classList.add("hidden");
  qs("navBar").classList.add("hidden");
  const result=qs("result");
  result.classList.remove("hidden");

  const subjectHtml=Object.entries(bySubject).filter(([_,v])=>v.t>0).map(([k,v])=>`<div class="metric"><div class="small">${k}</div><div class="v">${Math.round(v.c/v.t*100)}</div><div class="small">${v.c} / ${v.t}</div></div>`).join("");

  result.innerHTML = `
    <div class="card">
      <h2>${auto ? "시간 종료" : "시험 종료"}</h2>
      <div class="small">${examMeta.title}</div>
      <p style="font-size:28px;font-weight:900;margin:12px 0 8px">${score}점</p>
      <div class="chips">
        <span class="chip">정답 ${correct}개</span>
        <span class="chip">오답 ${exam.length-correct}개</span>
        <span class="chip">${score>=60 ? "합격권" : "보강 필요"}</span>
      </div>
      <div class="row" style="margin-top:14px">
        <button onclick="location.reload()">처음으로</button>
        <button class="secondary" onclick="retryWrong()">오답노트 복습</button>
      </div>
    </div>
    <div class="card"><h2>과목별 점수</h2><div class="kpi">${subjectHtml}</div></div>
    <div class="card">
      <h2>문항별 해설</h2>
      ${review.map((r,n)=>`<div class="review"><div style="font-weight:900;line-height:1.45">${n+1}. [${r.q.subject}] ${r.q.question}</div><div class="small" style="margin-top:8px">내 답: ${r.user===undefined ? "미응답" : (r.user+1)+". "+r.q.choices[r.user]}</div><div class="small" style="margin-top:4px">정답: ${r.q.answer+1}. ${r.q.choices[r.q.answer]}</div><div style="margin-top:8px">${r.q.explanation}</div></div>`).join("")}
    </div>`;
  window.scrollTo({top:0, behavior:"smooth"});
}

function retryWrong(){ qs("mode").value="wrong"; qs("questionCount").value=30; qs("timeLimit").value=30; startExam(false); }

qs("startBtn").onclick=()=>startExam(false);
qs("sampleBtn").onclick=()=>startExam(true);
qs("resetWrongBtn").onclick=()=>{ localStorage.removeItem(WRONG_KEY); alert("오답노트를 초기화했다."); };
qs("resetStatsBtn").onclick=()=>{ localStorage.removeItem(STATS_KEY); renderStats(); alert("누적 통계를 초기화했다."); };
qs("prevBtn").onclick=()=>{ if(idx>0){ idx--; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); } };
qs("nextBtn").onclick=()=>{ if(idx<exam.length-1){ idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); } };
qs("flagBtn").onclick=()=>{ const q=exam[idx]; if(flags.has(q.id)) flags.delete(q.id); else flags.add(q.id); renderQuestion(); };
qs("submitBtn").onclick=()=>{ if(confirm("지금 제출할까?")) finishExam(false); };

renderStats();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
